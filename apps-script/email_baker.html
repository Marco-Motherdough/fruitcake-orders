<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head>
<body style="margin:0;padding:0;background:#FFFFFF;color:#4C3329;font-family:Poppins,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;letter-spacing:0.3px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr><td style="padding:24px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">

  <tr><td style="padding-bottom:16px;border-bottom:1px solid #EFE7DC;">
    <div style="font-size:11px;letter-spacing:2px;color:#8A6331;">NEW FRUITCAKE ORDER</div>
    <div style="font-size:28px;line-height:1.25;color:#AE8344;"><?= d.order_number ?></div>
    <div style="font-weight:600;padding-top:4px;">Pickup <?= d.pickup_long ?></div>
    <div><?= d.slot_label ?>, <?= d.slot_time ?> · <?= d.store_name ?></div>
  </td></tr>

  <tr><td style="padding:16px 0;border-bottom:1px solid #EFE7DC;">
    <div style="font-size:11px;letter-spacing:2px;color:#8A6331;">CUSTOMER</div>
    <div style="font-weight:500;"><?= d.name ?></div>
    <div><?= d.cell ?></div>
    <div><?= d.email ?></div>
  </td></tr>

  <tr><td style="padding:16px 0 0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <? for (var i = 0; i < d.lines.length; i++) { ?>
      <tr>
        <td style="padding:8px 0;border-bottom:1px solid #EFE7DC;color:#7A655A;vertical-align:top;width:40%;"><?= d.lines[i].label ?></td>
        <td style="padding:8px 0;border-bottom:1px solid #EFE7DC;vertical-align:top;font-weight:500;"><?= d.lines[i].value ?></td>
      </tr>
      <? } ?>
      <tr>
        <td style="padding:12px 0;font-weight:600;">Total</td>
        <td style="padding:12px 0;font-weight:600;"><?= d.total ?></td>
      </tr>
    </table>
  </td></tr>

  <? if (d.source) { ?>
  <tr><td style="padding-top:8px;font-size:12px;color:#7A655A;">Source: <?= d.source ?></td></tr>
  <? } ?>

</table>
</td></tr>
</table>
</body>
</html>
